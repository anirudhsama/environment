# Mac. Loaded automatically on macOS via auto_env (see .miserc.toml).
# Sections ordered the way `mise bootstrap` runs them — see mise.toml for the
# full phase list.

# --- 1. system packages ------------------------------------------------------
# Curated equivalents of the Arch package set. Apple-provided tools stay with
# macOS, and Linux-only packages are omitted. mise itself remains on the vendor
# installer so `mise self-update` works.
[bootstrap.packages]

# --- system / provisioning ---
"brew:git" = "latest"
"brew:rsync" = "latest"

# --- remote access ---
# Tailscale remains the signed Mac app rather than a second Homebrew install.
"brew:mosh" = "latest"

# --- shell ---
"brew:fish" = "latest"
"brew:atuin" = "latest"
"brew:zellij" = "latest"

# --- editor ---
"brew:neovim" = "latest"

# --- android / jvm ---
"brew:openjdk@17" = "latest"

# --- dev tooling ---
"brew:gh" = "latest"
"brew-cask:sentry-cli" = "latest"
# Coding agents use Omarchy's mise backends through the shared global config.

# --- fonts used by the tracked Ghostty fallback chain ---
"brew-cask:font-jetbrains-mono" = "latest"

# --- database clients ---
"brew:libpq" = "latest"
"brew:pgcli" = "latest"

# --- cli quality of life ---
"brew:ripgrep" = "latest"
"brew:fzf" = "latest"
"brew:fd" = "latest"
"brew:bat" = "latest"
"brew:tree" = "latest"
"brew:jq" = "latest"
"brew:wget" = "latest"

# --- monitoring ---
"brew:htop" = "latest"
"brew:btop" = "latest"

# --- media ---
"brew:ffmpeg" = "latest"

# --- cloud ---
"brew:awscli" = "latest"

# --- secrets ---
"brew:age" = "latest"

# --- agent process plumbing ---
"brew:socat" = "latest"

# --- 3. dotfiles (macOS-only) ------------------------------------------------
# [dotfiles] has no per-entry OS filter, but a [dotfiles] table inside a
# platform config effectively is one — this only applies where mise loads
# mise.macos.toml.
[dotfiles]
"~/.gradle/gradle.properties" = { source = "home/.gradle/gradle.properties.macos", mode = "symlink" }

# --- 6. LaunchAgents ---------------------------------------------------------
# DevboxDrop stays hand-installed: it's WatchPaths driven and mise's launchd
# schema has no WatchPaths or ThrottleInterval (see scripts/bootstrap-macos).
#
# reference-repos is calendar-driven and fits the schema. Program points at the
# real libexec copy (installed by bootstrap-macos) so launchd is not denied TCC
# access via a symlink into Documents.
[bootstrap.macos.launchd.agents.reference-repos]
program = "~/.local/libexec/sync-reference-repos"
run_at_load = false
start_calendar_interval = { hour = 6, minute = 0 }
environment = { PATH = "/opt/homebrew/bin:/usr/bin:/bin" }
stdout_path = "~/Library/Logs/reference-repos.log"
stderr_path = "~/Library/Logs/reference-repos.log"

# Match Devbox: expose T3 directly on the private Tailnet rather than adding a
# second Tailscale Serve/HTTPS proxy layer.
[bootstrap.macos.launchd.agents.t3-code]
program = "~/.local/share/mise/shims/bunx"
args = ["t3@nightly", "serve", "--host", "0.0.0.0", "--port", "3773", "--base-dir", "/Users/ani/.t3"]
run_at_load = true
keep_alive = true
throttle_interval = 5
environment = { HOME = "/Users/ani", PATH = "/Users/ani/.bun/bin:/Users/ani/.local/bin:/Users/ani/.local/share/mise/shims:/usr/bin:/bin:/usr/sbin:/sbin" }
working_directory = "~"
stdout_path = "~/Library/Logs/t3-code.log"
stderr_path = "~/Library/Logs/t3-code.log"

# --- 8. login shell ----------------------------------------------------------
# mise registers Homebrew Fish in /etc/shells before changing the account.
[bootstrap.user]
login_shell = "/opt/homebrew/bin/fish"

# --- 10. convergence task (platform half) ------------------------------------
[tasks.platform]
description = "macOS: DevboxDrop LaunchAgent, reference-repos libexec"
run = "./scripts/bootstrap-macos"
