# Arch devbox. Loaded automatically on Linux via auto_env (see .miserc.toml).
# Sections ordered the way `mise bootstrap` runs them — see mise.toml for the
# full phase list.

# --- 1. system packages ------------------------------------------------------
# mise is deliberately absent: it comes from https://mise.run, the only install
# route that enables `mise self-update`, and it's the one tool where distro
# packaging measurably lags (near-daily releases).
#
# git is also in bootstrap.sh's seed set; declaring it here too is intentional —
# this table is the complete picture and pacman --needed makes it a no-op.
#
[bootstrap.packages]

# --- system / provisioning ---
"pacman:base-devel" = "latest"
"pacman:git" = "latest"
"pacman:openssh" = "latest"
"pacman:rsync" = "latest"
"pacman:ufw" = "latest"

# --- remote access ---
"pacman:mosh" = "latest"
"pacman:tailscale" = "latest"

# --- shell ---
"pacman:fish" = "latest"
"pacman:atuin" = "latest"
"pacman:zellij" = "latest"

# --- editor ---
"pacman:neovim" = "latest"

# --- android / jvm ---
# The JDK the Android Gradle Plugin runs on. Arch's package registers with
# archlinux-java, which maintains the /usr/lib/jvm/default symlink config.fish
# points JAVA_HOME at. A project needing a different JDK declares it in its own
# mise.toml. The SDK itself (~9 GB) is not a package — see scripts/android-sdk.
"pacman:jdk17-openjdk" = "latest"

# --- dev tooling ---
"pacman:github-cli" = "latest"
"pacman:sentry-cli" = "latest"
# Both agent CLIs are in extra at upstream parity — no AUR needed.
"pacman:openai-codex" = "latest"
"pacman:opencode" = "latest"

# --- database clients (client only; postgresql-libs owns /usr/bin/psql) ---
"pacman:postgresql-libs" = "latest"
"pacman:pgcli" = "latest"

# --- cli quality of life ---
"pacman:ripgrep" = "latest"
"pacman:fzf" = "latest"
"pacman:fd" = "latest"
"pacman:bat" = "latest"
"pacman:tree" = "latest"
"pacman:jq" = "latest"
"pacman:wget" = "latest"
"pacman:curl" = "latest"
"pacman:unzip" = "latest"

# --- monitoring (enabled as system services by scripts/bootstrap-linux) ---
"pacman:htop" = "latest"
"pacman:btop" = "latest"
"pacman:atop" = "latest"
"pacman:sysstat" = "latest"

# --- media ---
"pacman:ffmpeg" = "latest"

# --- cloud ---
"pacman:aws-cli-v2" = "latest"

# --- secrets (fnox) ---
"pacman:age" = "latest"

# --- claude code sandboxing ---
"pacman:bubblewrap" = "latest"
"pacman:socat" = "latest"

# --- debugging ---
"pacman:tcpdump" = "latest"

# --- 3. dotfiles (Linux-only) ------------------------------------------------
# [dotfiles] has no per-entry OS filter, but a [dotfiles] table inside a
# platform config effectively is one — this only applies where mise loads
# mise.linux.toml.
[dotfiles]
"~/.bash_profile" = { source = "home/.bash_profile", mode = "symlink" }
"~/.bashrc" = { source = "home/.bashrc", mode = "symlink" }
"~/.gradle/gradle.properties" = { source = "home/.gradle/gradle.properties.linux", mode = "symlink" }

# --- 7. systemd user units ---------------------------------------------------
# mise writes and enables these directly, namespaced as dev.mise.<name>.service.
# `%h` is expanded by systemd, not mise.
#
# Anything that spawns subprocesses runs via `mise exec`: systemd user services
# get PATH=/usr/local/bin:/usr/bin and nothing else, so node and bun would be
# invisible to LSP servers, npx-based MCP servers and formatters.
[bootstrap.linux.systemd.units.opencode]
description = "OpenCode remote server"
after = ["network-online.target"]
type = "simple"
exec_start = "%h/.local/bin/mise exec -- opencode serve --hostname 0.0.0.0 --port 4096"
restart = "always"
restart_sec = "5"
wanted_by = ["default.target"]

[bootstrap.linux.systemd.units.t3-code]
description = "T3 Code remote environment server"
after = ["network-online.target"]
type = "simple"
exec_start = "%h/.local/bin/mise exec -- npx --yes t3@nightly serve --host 0.0.0.0 --port 3773 --base-dir %h/.t3"
restart = "always"
restart_sec = "5"
wanted_by = ["default.target"]

# No mise exec: this spawns nothing, so it would be pure overhead.
[bootstrap.linux.systemd.units.taildrop-inbox]
description = "Drain Taildrop files into ~/inbox"
after = ["network.target"]
exec_start = "/usr/bin/tailscale file get --loop --conflict=rename %h/inbox"
restart = "on-failure"
restart_sec = "10"
wanted_by = ["default.target"]

# Daily shallow-sync of ~/code/references. oneshot + timer pair; mise renders
# entries with timer keys as .timer units targeting the sibling service.
[bootstrap.linux.systemd.units.reference-repos]
description = "Sync lean reference repos under ~/code/references"
after = ["network-online.target"]
type = "oneshot"
exec_start = "%h/.local/bin/sync-reference-repos"
# User units get a bare PATH; git is under /usr/bin on Arch.
environment = { PATH = "/usr/local/bin:/usr/bin:/bin" }
standard_output = "journal"
standard_error = "journal"
# oneshot: do not leave it "running"; apply should not try to keep it up.
start = false
wanted_by = []

[bootstrap.linux.systemd.units.reference-repos-timer]
description = "Daily lean reference repo sync"
on_calendar = "daily"
persistent = true
randomized_delay_sec = "30m"
unit = "reference-repos"

# --- 8. login shell ----------------------------------------------------------
# Remote SSH feeds a bash bootstrap script to the login shell without a PTY.
# Bash stays the account shell so that script parses. The tracked .bash_profile
# replaces interactive terminal logins with fish.
[bootstrap.user]
login_shell = "/usr/bin/bash"

# --- 10. convergence task (platform half) ------------------------------------
[tasks.platform]
description = "Linux: tailscaled, linger, monitoring, ~/code/references"
run = "./scripts/bootstrap-linux"
