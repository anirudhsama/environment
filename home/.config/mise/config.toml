# Global tools — on PATH everywhere, on both machines.
#
# What belongs here: language runtimes, and CLIs that either aren't packaged by
# pacman/brew, lag materially behind upstream there, or are npm-only. Anything
# pacman ships at upstream parity stays an OS package (see mise.toml).
#
# Project-specific runtimes (erlang, elixir, ...) belong in that project's own
# mise.toml, not here.

[tools]
node = "24"
bun = "1.4"
python = "3.12"
# uv is mise-managed, deliberately NOT a pacman/brew package — two copies with
# the shim silently winning is worse than either choice alone.
uv = "latest"
fnox = "latest"
# jdx, same as fnox: keep it on mise's train (completions require it). Don't
# also brew/pacman it — two copies with the shim winning is the worse outcome.
usage = "latest"

# CLIs with no OS package, or where the OS package split the two machines.
hunkdiff = { version = "latest", auto_update = true } # aqua:modem-dev/hunk — native binary, no node
doppler = "latest"
hasura-cli = "latest"
"github:RevenueCat/revenuecat-cli" = { version = "latest", matching = "rc_" }

# npm-only CLIs shared by every machine.
"npm:eas-cli" = { version = "latest", auto_update = true }
"npm:vercel" = { version = "latest", auto_update = true }
"npm:agent-browser" = { version = "latest", auto_update = true }
# browse (anomalyco/browse): the MCP server and relay behind the browse Chrome
# extension, so agents drive the Mac's signed-in Chrome. Macs only: the devbox
# has no display. Its self-updater doesn't touch a mise install, so
# auto_update owns upgrades. sync-common-mcps registers it with the agents.
# The package name is under 30 days old, which trips mise's supply-chain
# check; it is OpenCode's, published from anomalyco/browse.
"npm:@opencode/browse" = { version = "latest", auto_update = true, allow_low_downloads = true, os = ["macos"] }

# Android CLI: mise installs the launcher, which keeps the real CLI under
# ~/.android/bin and ~/.android/cli. ~/.androidrc picks the SDK per platform.
android-cli = { version = "latest", auto_update = true }

# Simlock device pool: the gateway runs on the devbox, the worker on
# dev-mbp-14. Upgraded deliberately, not by auto_update: the gateway and
# workers must stay protocol-compatible, and T3's Simlock source needs a
# recent enough version. The services run `latest`, so after a bump restart
# both (see README). Low npm download counts trip
# mise's supply-chain check; the package is Callstack's, published from
# callstackincubator/simlock.
"npm:simlock" = { version = "0.8.0", allow_low_downloads = true }
# The worker's agent-device must be the version T3 pins in
# apps/server/src/device/deviceToolVersions.json. 0.21.41 speaks RPC
# protocol 3, which simlock 0.8.0 doesn't support yet, so the worker's
# install is patched by hand (see README, Simlock, "agent-device ahead of
# Simlock").
"npm:agent-device" = "0.21.41"

# Coding agents. Bare mise aliases follow the same backends Omarchy uses; Grok
# is explicit because that is Omarchy's package choice and xAI's published CLI.
claude = { version = "latest", auto_update = true }
codex = { version = "latest", auto_update = true }
# Bare registry names, as Omarchy declares them: T3 Code's Update runs
# `mise upgrade <name>` only for these names. `opencode` is npm:@opencode/cli,
# whose registry entry allows its native-binary install script; `grok` and `pi`
# are native release binaries (http:grok, aqua:earendil-works/pi). `agy` is
# Google's Antigravity CLI (aqua:google-antigravity/antigravity-cli), the name
# T3 Code looks up on PATH.
opencode = { version = "latest", auto_update = true }
grok = { version = "latest", auto_update = true }
pi = { version = "latest", auto_update = true }
agy = { version = "latest", auto_update = true }

# agy's built-in updater replaces its own binary, which would rewrite mise's
# install behind its back; mise's auto_update owns upgrades instead.
[env]
AGY_CLI_DISABLE_AUTO_UPDATE = "1"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
minimum_release_age_excludes = [
  "claude",
  "codex",
  "opencode",
  "grok",
  "pi",
  "agy",
]
trusted_config_paths = [
  "/Users/ani/conductor/workspaces",
  "/Users/ani/Documents/code/workspaces",
  "/Users/ani/.t3/worktrees/",
  "/Users/ani/.superset/worktrees",
  "/Users/ani/.codex/worktrees",
]
lockfile = true

# Background updater for the auto_update tools above (agents and fast-moving
# CLIs), so they stay current without `mise upgrade`: a LaunchAgent on macOS, a
# systemd user unit on Linux (linger is enabled by bootstrap-linux). Checks
# hourly, updates each tool once its interval (tool_update.check_duration,
# default 24h) is due. While it runs, shim and `mise x` launches skip their own
# update and never wait on a download; tools run straight from PATH under
# activation never update on launch at all. Built-in services must live in
# global config.
[bootstrap.services.mise-tool-update]
builtin = "tool-update"
