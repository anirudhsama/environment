# Global tools — on PATH everywhere, on both machines.
#
# What belongs here: language runtimes, and CLIs that either aren't packaged by
# pacman/brew, lag materially behind upstream there, or are npm-only. Anything
# pacman ships at upstream parity stays an OS package (see mise.toml).
#
# Project-specific runtimes (erlang, elixir, ...) belong in that project's own
# mise.toml, not here.

[tools]
node = "24"
bun = "1.4"
python = "3.12"
# uv is mise-managed, deliberately NOT a pacman/brew package — two copies with
# the shim silently winning is worse than either choice alone.
uv = "latest"
fnox = "latest"
# jdx, same as fnox: keep it on mise's train (completions require it). Don't
# also brew/pacman it — two copies with the shim winning is the worse outcome.
usage = "latest"

# CLIs with no OS package, or where the OS package split the two machines.
hunkdiff = "latest"            # aqua:modem-dev/hunk — native binary, no node
doppler = "latest"
hasura-cli = "latest"
"github:RevenueCat/revenuecat-cli" = { version = "latest", matching = "rc_" }

# npm-only CLIs shared by every machine.
"npm:eas-cli" = "latest"
"npm:vercel" = "latest"
"npm:agent-browser" = "latest"

# Coding agents. Bare mise aliases follow the same backends Omarchy uses; Grok
# is explicit because that is Omarchy's package choice and xAI's published CLI.
#
# auto_update keeps them on the newest release without `mise upgrade`. The
# mise-tool-update service below does the updating in the background; while it
# runs, shim and `mise x` launches skip their own update and never wait on a
# download. Agents run straight from PATH under activation never update on
# launch at all.
claude = { version = "latest", auto_update = true }
codex = { version = "latest", auto_update = true }
# OpenCode 2 ships on npm; the bare `opencode` alias follows the V1-only aqua
# backend. mise skips install scripts, so run the postinstall that selects the
# native binary.
"npm:@opencode/cli" = { version = "latest", auto_update = true, postinstall = 'node "$MISE_TOOL_INSTALL_PATH/node_modules/@opencode/cli/postinstall.mjs"' }
# xAI's npm package keeps the native binary under ~/.grok/bin. Re-run its
# postinstall from the mise install so that symlink follows the mise version.
"npm:@xai-official/grok" = { version = "latest", auto_update = true, postinstall = 'node "$MISE_TOOL_INSTALL_PATH/node_modules/@xai-official/grok/bin/postinstall.js"' }
"npm:@earendil-works/pi-coding-agent" = { version = "latest", auto_update = true }

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
minimum_release_age_excludes = [
  "claude",
  "codex",
  "npm:@opencode/cli",
  "npm:@xai-official/grok",
  "npm:@earendil-works/pi-coding-agent",
]
trusted_config_paths = [
  "/Users/ani/conductor/workspaces",
  "/Users/ani/Documents/code/workspaces",
  "/Users/ani/.t3/worktrees/",
  "/Users/ani/.superset/worktrees",
  "/Users/ani/.codex/worktrees",
]
lockfile = true

# Background updater for the auto_update tools above: a LaunchAgent on macOS, a
# systemd user unit on Linux (linger is enabled by bootstrap-linux). Checks
# hourly, updates each tool once its interval (tool_update.check_duration,
# default 24h) is due. Built-in services must live in global config.
[bootstrap.services.mise-tool-update]
builtin = "tool-update"
