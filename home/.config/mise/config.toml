# Global tools — on PATH everywhere, on both machines.
#
# What belongs here: language runtimes, and CLIs that either aren't packaged by
# pacman/brew, lag materially behind upstream there, or are npm-only. Anything
# pacman ships at upstream parity stays an OS package (see mise.toml).
#
# Project-specific runtimes (erlang, elixir, ...) belong in that project's own
# mise.toml, not here.

[tools]
node = "24"
bun = "1.3"
python = "3.12"
# uv is mise-managed, deliberately NOT a pacman/brew package — two copies with
# the shim silently winning is worse than either choice alone.
uv = "latest"
fnox = "latest"
# jdx, same as fnox: keep it on mise's train (completions require it). Don't
# also brew/pacman it — two copies with the shim winning is the worse outcome.
usage = "latest"

# CLIs with no OS package, or where the OS package split the two machines.
hunkdiff = "latest"            # aqua:modem-dev/hunk — native binary, no node
doppler = "latest"
hasura-cli = "latest"

# npm-only CLIs shared by every machine.
"npm:eas-cli" = "latest"
"npm:vercel" = "latest"
"npm:agent-browser" = "latest"

# Coding agents. Bare mise aliases follow the same backends Omarchy uses; Grok
# is explicit because that is Omarchy's package choice and xAI's published CLI.
claude = "latest"
codex = "latest"
opencode = "latest"
"npm:@xai-official/grok" = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python"]
minimum_release_age_excludes = [
  "claude",
  "codex",
  "opencode",
  "npm:@xai-official/grok",
]
trusted_config_paths = [
  "/Users/ani/conductor/workspaces",
  "/Users/ani/Documents/code/workspaces",
  "/Users/ani/.t3/worktrees/",
  "/Users/ani/.superset/worktrees",
  "/Users/ani/.codex/worktrees",
]
lockfile = true
