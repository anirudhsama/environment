[Service]
# OpenCode 2 always requires a password and generates a new one on first start.
# Keep a fixed one in this untracked file as OPENCODE_SERVER_PASSWORD=...
# `serve --service` reads its password from the persisted service config, so
# copy it in before each start ($$ escapes systemd's own expansion).
EnvironmentFile=%h/.config/opencode/serve.env
ExecStartPre=%h/.local/bin/mise exec -- sh -c 'opencode service set password "$$OPENCODE_SERVER_PASSWORD"'
